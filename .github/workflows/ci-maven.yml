name: CI Maven

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Setup deepinthink/amoeba
        uses: deepinthink/amoeba/.github/actions/setup-amoeba/java@main

      - name: Build && Install ember-spring-blockchain
        run: cd infrastructure/framework/java/ember-spring-blockchain && ./mvnw install -B

      - name: Build && Install ember-spring-blockchain-benchmark
        run: cd infrastructure/benchmark/java/ember-spring-blockchain-benchmark && ./mvnw install -B
